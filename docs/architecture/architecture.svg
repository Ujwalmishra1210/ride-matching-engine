<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1300" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1L8 5L1 9" fill="none" stroke="#475569" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrowDash" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1L8 5L1 9" fill="none" stroke="#94A3B8" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1600" height="1300" fill="#FFFFFF"/>
  <text x="800" y="34" text-anchor="middle" font-size="24" font-weight="700" fill="#0F172A">ride-matching-engine — system architecture</text>

  <!-- ============ CLIENT LAYER ============ -->
  <text x="60" y="72" font-size="13" font-weight="700" fill="#64748B" letter-spacing="1">CLIENT LAYER</text>

  <rect x="60" y="82" width="700" height="100" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
  <text x="410" y="112" text-anchor="middle" font-size="16" font-weight="700" fill="#1E3A8A">Dashboard (React + Vite)</text>
  <text x="410" y="134" text-anchor="middle" font-size="12.5" fill="#1E3A8A">Dashboard.jsx · DriverMap · DriverPanel · RidePanel · StatsBar</text>
  <text x="410" y="154" text-anchor="middle" font-size="12.5" fill="#1E3A8A">useDashboardSocket hook (frontend/src)</text>

  <rect x="840" y="82" width="700" height="100" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
  <text x="1190" y="112" text-anchor="middle" font-size="16" font-weight="700" fill="#1E3A8A">Driver clients</text>
  <text x="1190" y="134" text-anchor="middle" font-size="12.5" fill="#1E3A8A">Real driver app, or driverSimulator.js / startSimulator.js</text>
  <text x="1190" y="154" text-anchor="middle" font-size="12.5" fill="#1E3A8A">simulates N drivers moving across Mumbai bounds over WS</text>

  <!-- connectors client -> api -->
  <line x1="330" y1="182" x2="230" y2="260" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrowDash)"/>
  <text x="120" y="222" font-size="11.5" fill="#475569">2) REST: fetch state</text>

  <line x1="600" y1="182" x2="700" y2="260" stroke="#7C3AED" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="720" y1="260" x2="620" y2="182" stroke="#7C3AED" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="630" y="222" font-size="11.5" fill="#475569">1) / 9) WS: live state</text>

  <line x1="1050" y1="182" x2="960" y2="260" stroke="#7C3AED" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="980" y1="260" x2="1070" y2="182" stroke="#7C3AED" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="985" y="222" font-size="11.5" fill="#475569">6) / 7) WS: location, offers, accept/reject</text>

  <!-- ============ API LAYER ============ -->
  <text x="60" y="248" font-size="13" font-weight="700" fill="#64748B" letter-spacing="1">API LAYER — server/src/index.js (Express + HTTP + WebSocket)</text>
  <rect x="60" y="258" width="1480" height="150" rx="10" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>

  <rect x="90" y="290" width="460" height="100" rx="8" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.3"/>
  <text x="320" y="316" text-anchor="middle" font-size="14.5" font-weight="700" fill="#4C1D95">REST API routes</text>
  <text x="320" y="336" text-anchor="middle" font-size="12" fill="#4C1D95">/api/rides/*, /api/driver/*,</text>
  <text x="320" y="352" text-anchor="middle" font-size="12" fill="#4C1D95">/api/nearby, /api/dashboard/state</text>

  <rect x="570" y="290" width="460" height="100" rx="8" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.3"/>
  <text x="800" y="316" text-anchor="middle" font-size="14.5" font-weight="700" fill="#4C1D95">WebSocket server</text>
  <text x="800" y="336" text-anchor="middle" font-size="12" fill="#4C1D95">wsServer.js — driver channel + dashboard channel</text>
  <text x="800" y="352" text-anchor="middle" font-size="12" fill="#4C1D95">sendRideOffer() · broadcast()</text>

  <rect x="1050" y="290" width="460" height="100" rx="8" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.3"/>
  <text x="1280" y="316" text-anchor="middle" font-size="14.5" font-weight="700" fill="#4C1D95">Dashboard event bus</text>
  <text x="1280" y="336" text-anchor="middle" font-size="12" fill="#4C1D95">dashboardEventBus.js (EventEmitter)</text>
  <text x="1280" y="352" text-anchor="middle" font-size="12" fill="#4C1D95">RIDE_UPDATED · DRIVER_UPDATED</text>

  <line x1="1050" y1="340" x2="1030" y2="340" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="960" y="330" font-size="11" fill="#475569" text-anchor="middle">8) broadcast</text>

  <!-- api -> core services -->
  <line x1="320" y1="390" x2="700" y2="470" stroke="#059669" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="380" y="435" font-size="12" fill="#065F46">1) POST /api/rides/request → dispatchRide()</text>

  <!-- ============ CORE SERVICES ============ -->
  <text x="60" y="450" font-size="13" font-weight="700" fill="#64748B" letter-spacing="1">CORE SERVICES — matching &amp; ride business logic</text>
  <rect x="60" y="460" width="1480" height="380" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>

  <rect x="540" y="480" width="520" height="80" rx="8" fill="#059669" stroke="#065F46" stroke-width="1.5"/>
  <text x="800" y="508" text-anchor="middle" font-size="15.5" font-weight="700" fill="#FFFFFF">Matching engine</text>
  <text x="800" y="528" text-anchor="middle" font-size="12" fill="#D1FAE5">matchingEngine.js — dispatchRide · completeRide · cancelRideRequest</text>

  <!-- row A -->
  <rect x="90"  y="590" width="340" height="90" rx="8" fill="#D1FAE5" stroke="#059669" stroke-width="1.2"/>
  <text x="260" y="618" text-anchor="middle" font-size="13.5" font-weight="700" fill="#064E3B">Dispatch lock service</text>
  <text x="260" y="636" text-anchor="middle" font-size="11.5" fill="#064E3B">Redis SET NX + Lua renew/release</text>
  <text x="260" y="652" text-anchor="middle" font-size="11.5" fill="#064E3B">one dispatch per ride at a time</text>

  <rect x="450" y="590" width="340" height="90" rx="8" fill="#D1FAE5" stroke="#059669" stroke-width="1.2"/>
  <text x="620" y="618" text-anchor="middle" font-size="13.5" font-weight="700" fill="#064E3B">Reservation service</text>
  <text x="620" y="636" text-anchor="middle" font-size="11.5" fill="#064E3B">WATCH/MULTI/EXEC — reserve,</text>
  <text x="620" y="652" text-anchor="middle" font-size="11.5" fill="#064E3B">finalize, start trip atomically</text>

  <rect x="810" y="590" width="340" height="90" rx="8" fill="#D1FAE5" stroke="#059669" stroke-width="1.2"/>
  <text x="980" y="618" text-anchor="middle" font-size="13.5" font-weight="700" fill="#064E3B">Offer service</text>
  <text x="980" y="636" text-anchor="middle" font-size="11.5" fill="#064E3B">in-memory pending offer map</text>
  <text x="980" y="652" text-anchor="middle" font-size="11.5" fill="#064E3B">accept / reject / 10s timeout</text>

  <rect x="1170" y="590" width="340" height="90" rx="8" fill="#D1FAE5" stroke="#059669" stroke-width="1.2"/>
  <text x="1340" y="618" text-anchor="middle" font-size="13.5" font-weight="700" fill="#064E3B">Location service</text>
  <text x="1340" y="636" text-anchor="middle" font-size="11.5" fill="#064E3B">Redis GEO index of driver positions</text>
  <text x="1340" y="652" text-anchor="middle" font-size="11.5" fill="#064E3B">candidate search by radius</text>

  <!-- row B -->
  <rect x="90"  y="700" width="340" height="90" rx="8" fill="#D1FAE5" stroke="#059669" stroke-width="1.2"/>
  <text x="260" y="728" text-anchor="middle" font-size="13.5" font-weight="700" fill="#064E3B">Ride service</text>
  <text x="260" y="746" text-anchor="middle" font-size="11.5" fill="#064E3B">rideService.js / rideState.js</text>
  <text x="260" y="762" text-anchor="middle" font-size="11.5" fill="#064E3B">ride CRUD &amp; state transitions</text>

  <rect x="450" y="700" width="340" height="90" rx="8" fill="#D1FAE5" stroke="#059669" stroke-width="1.2"/>
  <text x="620" y="728" text-anchor="middle" font-size="13.5" font-weight="700" fill="#064E3B">ETA service</text>
  <text x="620" y="746" text-anchor="middle" font-size="11.5" fill="#064E3B">etaService.js</text>
  <text x="620" y="762" text-anchor="middle" font-size="11.5" fill="#064E3B">estimates driver arrival time</text>

  <rect x="810" y="700" width="340" height="90" rx="8" fill="#D1FAE5" stroke="#059669" stroke-width="1.2"/>
  <text x="980" y="728" text-anchor="middle" font-size="13.5" font-weight="700" fill="#064E3B">Driver stats service</text>
  <text x="980" y="746" text-anchor="middle" font-size="11.5" fill="#064E3B">accepted / rejected / completed /</text>
  <text x="980" y="762" text-anchor="middle" font-size="11.5" fill="#064E3B">cancelled trip counters per driver</text>

  <rect x="1170" y="700" width="340" height="90" rx="8" fill="#D1FAE5" stroke="#059669" stroke-width="1.2"/>
  <text x="1340" y="728" text-anchor="middle" font-size="13.5" font-weight="700" fill="#064E3B">Dispatch metrics service</text>
  <text x="1340" y="746" text-anchor="middle" font-size="11.5" fill="#064E3B">match success/fail, dispatch time,</text>
  <text x="1340" y="762" text-anchor="middle" font-size="11.5" fill="#064E3B">driver response time</text>

  <!-- matching engine -> row A -->
  <line x1="700" y1="560" x2="400" y2="588" stroke="#059669" stroke-width="1.4" marker-end="url(#arrow)"/>
  <text x="470" y="577" font-size="11" fill="#065F46">2) lock</text>
  <line x1="760" y1="560" x2="720" y2="588" stroke="#059669" stroke-width="1.4" marker-end="url(#arrow)"/>
  <text x="700" y="577" font-size="11" fill="#065F46">4) reserve</text>
  <line x1="840" y1="560" x2="920" y2="588" stroke="#059669" stroke-width="1.4" marker-end="url(#arrow)"/>
  <text x="890" y="577" font-size="11" fill="#065F46">5) offer</text>
  <line x1="900" y1="560" x2="1250" y2="588" stroke="#059669" stroke-width="1.4" marker-end="url(#arrow)"/>
  <text x="1030" y="577" font-size="11" fill="#065F46">3) find candidates (GEO)</text>

  <!-- matching engine <-> ws server (offer send / accept-reject route) -->
  <path d="M1060 500 C 1250 480, 1350 420, 1280 390" fill="none" stroke="#7C3AED" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="1150" y="450" font-size="11.5" fill="#4C1D95">5) sendRideOffer → 6) push to driver</text>
  <path d="M980 590 C 1050 500, 1150 420, 1120 390" fill="none" stroke="#7C3AED" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arrowDash)"/>
  <text x="990" y="470" font-size="11.5" fill="#4C1D95">7) ACCEPT/REJECT routed to offer service</text>

  <!-- reservation -> event bus -->
  <path d="M700 590 C 900 500, 1150 420, 1150 390" fill="none" stroke="#059669" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="700" y="470" font-size="11.5" fill="#065F46">8) emit RIDE_UPDATED / DRIVER_UPDATED</text>

  <!-- ============ BACKGROUND JOBS ============ -->
  <text x="60" y="880" font-size="13" font-weight="700" fill="#64748B" letter-spacing="1">BACKGROUND JOBS</text>
  <rect x="60" y="890" width="710" height="90" rx="8" fill="#FFEDD5" stroke="#EA580C" stroke-width="1.4"/>
  <text x="415" y="920" text-anchor="middle" font-size="14" font-weight="700" fill="#7C2D12">Heartbeat monitor</text>
  <text x="415" y="940" text-anchor="middle" font-size="12" fill="#7C2D12">heartbeatService.js — polls driver keys every 5s,</text>
  <text x="415" y="956" text-anchor="middle" font-size="12" fill="#7C2D12">marks stale drivers OFFLINE</text>

  <rect x="830" y="890" width="710" height="90" rx="8" fill="#FFEDD5" stroke="#EA580C" stroke-width="1.4"/>
  <text x="1185" y="920" text-anchor="middle" font-size="14" font-weight="700" fill="#7C2D12">Ride timeout monitor</text>
  <text x="1185" y="940" text-anchor="middle" font-size="12" fill="#7C2D12">rideTimeoutService.js — releases drivers whose</text>
  <text x="1185" y="956" text-anchor="middle" font-size="12" fill="#7C2D12">assignment is stuck past ASSIGNMENT_TIMEOUT_MS</text>

  <line x1="415" y1="890" x2="1340" y2="790" stroke="#EA580C" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arrowDash)"/>
  <line x1="1185" y1="890" x2="800" y2="560" stroke="#EA580C" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arrowDash)"/>
  <text x="900" y="850" font-size="11.5" fill="#7C2D12">background cleanup calls into location / matching services</text>

  <!-- ============ DATA LAYER ============ -->
  <text x="60" y="1010" font-size="13" font-weight="700" fill="#64748B" letter-spacing="1">DATA LAYER</text>
  <rect x="60" y="1020" width="1480" height="150" rx="10" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.5"/>
  <text x="90" y="1048" font-size="15" font-weight="700" fill="#7F1D1D">Redis</text>

  <rect x="90"  y="1060" width="340" height="90" rx="8" fill="#FECACA" stroke="#DC2626" stroke-width="1.2"/>
  <text x="260" y="1090" text-anchor="middle" font-size="13" font-weight="700" fill="#7F1D1D">GEO index</text>
  <text x="260" y="1108" text-anchor="middle" font-size="11.5" fill="#7F1D1D">drivers:locations</text>

  <rect x="450" y="1060" width="340" height="90" rx="8" fill="#FECACA" stroke="#DC2626" stroke-width="1.2"/>
  <text x="620" y="1090" text-anchor="middle" font-size="13" font-weight="700" fill="#7F1D1D">Driver hashes</text>
  <text x="620" y="1108" text-anchor="middle" font-size="11.5" fill="#7F1D1D">driver:&lt;id&gt; — status, location, stats</text>

  <rect x="810" y="1060" width="340" height="90" rx="8" fill="#FECACA" stroke="#DC2626" stroke-width="1.2"/>
  <text x="980" y="1090" text-anchor="middle" font-size="13" font-weight="700" fill="#7F1D1D">Ride hashes</text>
  <text x="980" y="1108" text-anchor="middle" font-size="11.5" fill="#7F1D1D">ride:&lt;id&gt; — state machine</text>

  <rect x="1170" y="1060" width="340" height="90" rx="8" fill="#FECACA" stroke="#DC2626" stroke-width="1.2"/>
  <text x="1340" y="1090" text-anchor="middle" font-size="13" font-weight="700" fill="#7F1D1D">Dispatch locks</text>
  <text x="1340" y="1108" text-anchor="middle" font-size="11.5" fill="#7F1D1D">dispatch-lock:&lt;rideId&gt;</text>

  <!-- core -> redis -->
  <line x1="800" y1="840" x2="800" y2="1018" stroke="#DC2626" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="800" y="1005" text-anchor="middle" font-size="12" fill="#7F1D1D">reads / writes all Redis structures above</text>

  <!-- ============ LEGEND ============ -->
  <rect x="60" y="1195" width="1480" height="90" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
  <text x="80" y="1220" font-size="13" font-weight="700" fill="#334155">Ride dispatch flow</text>
  <text x="80" y="1242" font-size="12" fill="#334155">1) rider POSTs /api/rides/request → dispatchRide()  2) acquire dispatch lock  3) find candidate drivers via Redis GEO  4) reserve driver (WATCH/MULTI/EXEC)</text>
  <text x="80" y="1262" font-size="12" fill="#334155">5) send ride offer over WebSocket  6) driver receives push  7) driver accepts/rejects  8) reservation finalized, event bus emits update  9) dashboard receives live broadcast</text>
</svg>
